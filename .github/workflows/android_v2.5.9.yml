name: Build Engine Oil Reminder APK v2.6.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          set -euo pipefail
          ARCHIVE="EngineOilReminder_v2.6.1_RoundedUI.zip"
          test -f "$ARCHIVE"
          rm -rf extracted
          mkdir -p extracted
          unzip -oq "$ARCHIVE" -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle -type f -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Java and Kotlin targets
        run: |
          grep -q "sourceCompatibility JavaVersion.VERSION_17" "$PROJECT_DIR/app/build.gradle"
          grep -q "targetCompatibility JavaVersion.VERSION_17" "$PROJECT_DIR/app/build.gradle"
          grep -q "jvmTarget = '17'" "$PROJECT_DIR/app/build.gradle"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Engine-Oil-Reminder-APK-v2.6.1
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
